<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .form-control { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-success { background: #28a745; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .acoes { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<h1>{{ titulo }}</h1>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
            <p style="color:red;">{{ field.errors }}</p>
        {% endif %}
    {% endfor %}
    <div class="acoes">
        <button type="submit" class="btn btn-success">💾 Salvar</button>
        <a href="{% url 'listar_produtos' %}" class="btn btn-secondary">← Cancelar</a>
    </div>
</form>

</body>
</html>
