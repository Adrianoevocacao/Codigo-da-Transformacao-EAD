<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 30px; text-align: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; margin: 5px; }
        .btn-danger    { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
<div class="card">
    <h2>⚠️ Confirmar Exclusão</h2>
    <p>Tem certeza que deseja excluir o produto:</p>
    <strong>{{ produto.nome }}</strong>
    <p>Essa ação não pode ser desfeita!</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Sim, excluir</button>
        <a href="{% url 'listar_produtos' %}" class="btn btn-secondary">← Cancelar</a>
    </form>
</div>
</body>
</html>
